name: Build & Release

on:
  push:
    branches: [main, integration]
  workflow_dispatch:
    inputs:
      build-linux:
        description: Also build for Linux
        type: boolean
        default: false
        required: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: GhwtdeIniTool

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check signing secrets
        shell: pwsh
        run: |
          $missing = @()
          if ("${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" -eq "") {
            $missing += "TAURI_SIGNING_PRIVATE_KEY"
          } else {
            Write-Host "TAURI_SIGNING_PRIVATE_KEY is set ✓"
          }
          if ("${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}" -eq "") {
            $missing += "TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          } else {
            Write-Host "TAURI_SIGNING_PRIVATE_KEY_PASSWORD is set ✓"
          }
          if ($missing.Count -gt 0) {
            Write-Host "::error::Missing required secrets: $($missing -join ', ')"
            exit 1
          }

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: GhwtdeIniTool/pnpm-lock.yaml

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true

      - name: Cache Rust target directory
        uses: actions/cache@v4
        with:
          path: |
            GhwtdeIniTool/src-tauri/target/release
            GhwtdeIniTool/src-tauri/target/release-bundle
          key: ${{ runner.os }}-tauri-target-${{ hashFiles('GhwtdeIniTool/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-tauri-target-

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Clean old bundle artifacts (avoid stale version mixing)
        run: Remove-Item -Recurse -Force src-tauri/target/release/bundle, src-tauri/target/release/ghwtdeinitool.exe -ErrorAction Ignore

      - name: Build Tauri app
        if: github.ref != 'refs/heads/main' || github.event_name != 'push'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: GhwtdeIniTool
          tauriScript: pnpm tauri
          uploadWorkflowArtifacts: true

      - name: Build and release Tauri app
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: GhwtdeIniTool
          tauriScript: pnpm tauri
          tagName: v__VERSION__
          releaseName: v__VERSION__
          releaseBody: |
            ## v__VERSION__
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: false
          uploadWorkflowArtifacts: true

  build-linux:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.build-linux == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GhwtdeIniTool

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: GhwtdeIniTool/pnpm-lock.yaml

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true

      - name: Cache Rust target directory
        uses: actions/cache@v4
        with:
          path: |
            GhwtdeIniTool/src-tauri/target/release
            GhwtdeIniTool/src-tauri/target/release-bundle
          key: ${{ runner.os }}-tauri-target-${{ hashFiles('GhwtdeIniTool/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-tauri-target-

      - name: Install system dependencies (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Clean old bundle artifacts (avoid stale version mixing)
        run: rm -rf src-tauri/target/release/bundle src-tauri/target/release/ghwtdeinitool

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: GhwtdeIniTool
          tauriScript: pnpm tauri
          uploadWorkflowArtifacts: true
